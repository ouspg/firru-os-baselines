# AlmaLinux golden set (bl-linux.sh): offline from the DVD (BaseOS and
# AppStream as released), the variant's packages chosen at install time as an
# administrator would. firewalld and SELinux at their defaults.
text
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --activate --hostname=baseline-alma
rootpw --lock
user --name=alma --iscrypted --password='<random hash, never used>'
zerombr
clearpart --all --initlabel
autopart
bootloader
poweroff

%packages
@^minimal-environment
postgresql-server
%end

%post
# The boot hook a baseline install leaves in the guest, written by the
# installer (kickstart %post, autoinstall late-commands, preseed late_command):
# the only file and units a run adds to the system. At every boot
# it mounts the BLTOOLS CD, if present, and runs its collect.sh once; before
# that, baseline-audit.service starts the connection audit from the CD and
# holds the network back until its probes are attached (a few seconds), so
# boot-time lookups (pollinate, snapd) are seen too.
mkdir -p /usr/local/sbin
cat > /usr/local/sbin/baseline-job.sh <<'J'
#!/bin/sh
# baseline-job.sh [audit]
[ -e /var/tmp/baseline/done ] && exit 0
mkdir -p /run/bl-tools
# Under SELinux the CD's files are iso9660_t, which a service may not execute
# (bpftrace for the connection audit): mounted as bin_t, like any system binary.
o=ro; [ -e /sys/fs/selinux/enforce ] && o=ro,context=system_u:object_r:bin_t:s0
# Early in boot (below) the drive can be late: up to 30 s.
i=0; until mountpoint -q /run/bl-tools || mount -o $o LABEL=BLTOOLS /run/bl-tools 2>/dev/null; do
  i=$((i+1)); [ $i -lt 15 ] || exit 0; sleep 2; done
if [ "${1:-}" = audit ]; then
  [ -e /run/bl-tools/bpftrace ] && [ -e /run/bl-tools/conn-audit.sh ] || exit 0
  PATH=/run/bl-tools:$PATH exec /bin/bash /run/bl-tools/conn-audit.sh start
fi
exec /bin/bash /run/bl-tools/collect.sh
J
chmod 0755 /usr/local/sbin/baseline-job.sh
cat > /etc/systemd/system/baseline-audit.service <<'U'
[Unit]
Description=Baseline connection audit (golden set), before the network
DefaultDependencies=no
After=local-fs.target sys-kernel-tracing.mount sys-kernel-debug.mount
Wants=sys-kernel-tracing.mount sys-kernel-debug.mount network-pre.target
Before=network-pre.target shutdown.target
Conflicts=shutdown.target
[Service]
Type=oneshot
RemainAfterExit=yes
TimeoutStartSec=60
ExecStart=/usr/local/sbin/baseline-job.sh audit
[Install]
WantedBy=multi-user.target
U
cat > /etc/systemd/system/baseline-job.service <<'U'
[Unit]
Description=Baseline collection (golden set), from the BLTOOLS CD
# Before the network comes up, so the connection audit sees boot-time
# lookups (pollinate, snapd); after the tracing mounts bpftrace needs.
DefaultDependencies=no
After=local-fs.target sys-kernel-tracing.mount sys-kernel-debug.mount baseline-audit.service
Wants=sys-kernel-tracing.mount sys-kernel-debug.mount network-pre.target
Before=network-pre.target shutdown.target
Conflicts=shutdown.target
[Service]
Type=exec
ExecStart=/usr/local/sbin/baseline-job.sh
[Install]
WantedBy=multi-user.target
U
systemctl enable baseline-audit.service baseline-job.service
%end
