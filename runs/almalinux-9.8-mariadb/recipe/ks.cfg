# AlmaLinux 9 baseline: minimal environment, firewalld and SELinux left at
# their defaults (enabled / enforcing) -- the point is the stock footprint.
text
url --url=https://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/
repo --name=AppStream --baseurl=https://repo.almalinux.org/almalinux/9/AppStream/x86_64/os/
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --activate --hostname=baseline-alma
rootpw --lock
user --name=alma --iscrypted --password='<random hash, never used>'
zerombr
clearpart --all --initlabel
autopart
bootloader
poweroff

%packages
@^minimal-environment
%end

%post
cat > /etc/systemd/system/baseline-job.timer <<'T'
[Unit]
Description=Baseline job (runs /usr/local/sbin/baseline-job.sh if present)
[Timer]
OnBootSec=120
[Install]
WantedBy=timers.target
T
cat > /etc/systemd/system/baseline-job.service <<'T'
[Unit]
Description=Baseline job
ConditionPathExists=/usr/local/sbin/baseline-job.sh
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/baseline-job.sh
T
systemctl enable baseline-job.timer
%end
