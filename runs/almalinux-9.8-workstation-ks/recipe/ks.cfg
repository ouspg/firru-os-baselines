# AlmaLinux 9 baseline: workstation-product-environment, firewalld and SELinux left at
# their defaults (enabled / enforcing) -- the point is the stock footprint.
text
url --url=https://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/
repo --name=AppStream --baseurl=https://repo.almalinux.org/almalinux/9/AppStream/x86_64/os/
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --activate --hostname=baseline-alma
rootpw --lock
user --name=alma --iscrypted --password='<random hash, never used>'
zerombr
clearpart --all --initlabel
autopart
xconfig --startxonboot
bootloader
poweroff

%packages
@^workstation-product-environment
%end

%post
cat > /etc/systemd/system/baseline-job.timer <<'T'
[Unit]
Description=Baseline job (runs /usr/local/sbin/baseline-job.sh if present)
[Timer]
OnBootSec=120
[Install]
WantedBy=timers.target
T
cat > /etc/systemd/system/baseline-job.service <<'T'
[Unit]
Description=Baseline job
ConditionPathExists=/usr/local/sbin/baseline-job.sh
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/baseline-job.sh
T
systemctl enable baseline-job.timer
# GDM autologin for alma, so user-session listeners are measured too (as on
# the Ubuntu desktop baseline), with gnome-initial-setup marked done.
sed -i 's/^\[daemon\]$/[daemon]\nAutomaticLoginEnable=True\nAutomaticLogin=alma/' /etc/gdm/custom.conf
install -d -o alma -g alma /home/alma/.config
install -o alma -g alma -m 644 /dev/null /home/alma/.config/gnome-initial-setup-done
%end
