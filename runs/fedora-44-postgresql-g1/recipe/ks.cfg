# Fedora golden set (bl-linux.sh): the Everything tree of the release as
# released (dl.fedoraproject.org releases/, which never changes) through the
# host's proxy, the only thing the guest reaches; no updates. The variant's
# packages chosen at install time as an administrator would. firewalld and
# SELinux at their defaults; the repo files on the installed system are stock.
text
url --url=http://192.168.150.1:3143/fedora-44-postgresql-g1/fedora/Everything/x86_64/os/
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --activate --hostname=baseline-fedora
rootpw --lock
user --name=fedora --iscrypted --password='<random hash, never used>'
zerombr
clearpart --all --initlabel
autopart
bootloader
poweroff

%packages
@^custom-environment
@sql-server
%end

%post
# Installed by the installer (kickstart %post, autoinstall late-commands):
# the only file and unit a golden-set run adds to the system. At every boot it
# mounts the BLTOOLS CD, if present, and runs its collect.sh once.
mkdir -p /usr/local/sbin
cat > /usr/local/sbin/baseline-job.sh <<'J'
#!/bin/sh
[ -e /var/tmp/baseline/done ] && exit 0
mkdir -p /run/bl-tools
mount -o ro LABEL=BLTOOLS /run/bl-tools || exit 0
exec /bin/bash /run/bl-tools/collect.sh
J
chmod 0755 /usr/local/sbin/baseline-job.sh
cat > /etc/systemd/system/baseline-job.service <<'U'
[Unit]
Description=Baseline collection (golden set), from the BLTOOLS CD
After=local-fs.target
[Service]
Type=exec
ExecStart=/usr/local/sbin/baseline-job.sh
[Install]
WantedBy=multi-user.target
U
systemctl enable baseline-job.service
%end
